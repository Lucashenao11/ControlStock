<div style="text-align: center;">

    <H1>BIENVENIDO A CONTROL STOCK</H1>
    <H2>Manten al dia el inventario de tu tienda</H2>

  </div>

  <div class = "Login-box">
    <!-- Campo de email -->
    <h2>Iniciar Sesión</h2>
    <div class = "input-email">
      <label for="email">Email</label>
      <input type = "email" id="email" name="email" placeholder="Write your email" required [(ngModel)] = "email"
>
    </div>
    <!-- Campo de contraseña -->
    <div class="input-password">
      <label for="password">contraseña</label>
      <input type = "password" id="password" name="password" placeholder="Ingresa tu contraseña" required [(ngModel)] = "password"
>
    </div>

    <p *ngIf = "errorMessage" >{{ errorMessage }}</p>

    <button type="button" class="btn-login" (click) = "onLogin()">Ingresar</button>

    <div class = "Register">
        <p class="register-text">
            ¿No tienes una cuenta? <a routerLink="/register">Regístrate</a>
        </p>

    </div>

  </div>
