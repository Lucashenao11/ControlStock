<h1>Sign Up</h1>

<div>

  <div>
    <label>User</label>
    <input type="text" placeholder="Write your username" required [(ngModel)]="user">
  </div>
  
  <div>
    <label>Email</label>
    <input type="email" placeholder="Write your email" required [(ngModel)]="email">
  </div>

  <div>
    <label>Password</label>
    <input type="password" placeholder="Write your password" required [(ngModel)]="password">
  </div>

  <div>
    <label>Confirm password</label>
    <input type="password" placeholder="Write your password again" required [(ngModel)]="passwordConfirmation">
  </div>

  <p *ngIf="errorMessage">{{ errorMessage }}</p>

  <button type="button" (click)="onRegister()">Sign Up</button>

  <div>
    <p>
      Already have an account? Sing in <a routerLink="/login"> Sign in</a>
    </p>
  </div>

</div>
